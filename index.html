<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Autos HWC · Expense Tracker</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] } } } };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style type="text/tailwindcss">
  [x-cloak]{display:none!important}
  .lbl{ @apply mb-1 block text-[13px] font-medium text-slate-600; }
  .inp{ @apply w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-[15px] text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/15; }
  .btn{ @apply inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition disabled:cursor-not-allowed disabled:opacity-50; }
  .btn-p{ @apply btn bg-emerald-600 text-white hover:bg-emerald-700; }
  .btn-s{ @apply btn bg-slate-100 text-slate-700 hover:bg-slate-200; }
  .btn-d{ @apply btn bg-rose-600 text-white hover:bg-rose-700; }
  .card{ @apply rounded-2xl border border-slate-200/80 bg-white shadow-sm; }
  .th{ @apply whitespace-nowrap px-4 py-3 text-left text-[11px] font-semibold uppercase tracking-wide text-slate-500; }
  .td{ @apply whitespace-nowrap px-4 py-3 text-sm text-slate-700; }
  .badge{ @apply inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-[11px] font-semibold; }
  .navitem{ @apply flex w-full items-center gap-3 rounded-xl px-3.5 py-2.5 text-sm font-medium transition; }
</style>
</head>

<body class="bg-slate-100 font-sans text-slate-800 antialiased" x-data="fleetApp()"
      :class="{'overflow-hidden': sidebarOpen || gastoOpen || gastoDetalleOpen || vehOpen || vehDetalleOpen || driverOpen || confirmModal.show}">

<!-- ══════════ TOASTS ══════════ -->
<div x-cloak x-show="toast.show" x-transition.opacity class="fixed bottom-5 left-1/2 z-[100] w-[92%] max-w-sm -translate-x-1/2">
  <div class="flex items-start gap-3 rounded-xl border-l-4 border border-slate-200 bg-white p-4 shadow-xl"
       :class="toast.type==='error' ? 'border-l-rose-500' : 'border-l-emerald-500'">
    <div class="mt-0.5 shrink-0" :class="toast.type==='error' ? 'text-rose-500' : 'text-emerald-500'">
      <svg x-show="toast.type!=='error'" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <svg x-show="toast.type==='error'" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9 0a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/></svg>
    </div>
    <div class="min-w-0">
      <p class="text-sm font-bold text-slate-800" x-text="toast.title"></p>
      <p class="text-sm text-slate-500" x-text="toast.msg"></p>
    </div>
  </div>
</div>

<!-- ══════════ LOGIN ══════════ -->
<div x-cloak x-show="!user" class="fixed inset-0 z-40 flex items-center justify-center overflow-y-auto bg-slate-950 p-4">
  <button @click="cambiarLang()" class="absolute right-4 top-4 flex items-center gap-1.5 rounded-full bg-white/10 px-3.5 py-2 text-[13px] font-semibold text-slate-200 transition hover:bg-white/20">
    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"/></svg>
    <span x-text="lang==='en' ? 'Español' : 'English'"></span>
  </button>
  <div class="w-full max-w-sm py-8">
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500 text-2xl font-extrabold text-white shadow-lg shadow-emerald-500/30">A</div>
      <h1 class="text-2xl font-extrabold text-white">Autos <span class="text-emerald-400">HWC</span></h1>
      <p class="mt-1 text-sm text-slate-400" x-text="t('login_sub')"></p>
    </div>
    <div class="card p-6 sm:p-7">
      <form @submit.prevent="login()" class="space-y-4">
        <div>
          <label class="lbl" x-text="t('email')"></label>
          <input type="email" x-model="loginEmail" class="inp" :placeholder="t('ph_email')" autocomplete="email">
        </div>
        <div>
          <label class="lbl" x-text="t('password')"></label>
          <div class="relative">
            <input :type="showPass ? 'text' : 'password'" x-model="loginPass" class="inp pr-11" placeholder="••••••••" autocomplete="current-password">
            <button type="button" @click="showPass=!showPass" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <svg x-show="!showPass" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <svg x-show="showPass" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-p w-full py-3" :disabled="cargandoLogin">
          <svg x-show="cargandoLogin" class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
          <span x-text="cargandoLogin ? t('logging_in') : t('btn_login')"></span>
        </button>
        <p x-cloak x-show="loginError" x-text="loginError" class="rounded-xl bg-rose-50 p-3 text-center text-sm text-rose-600"></p>
      </form>
    </div>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div x-cloak x-show="user" class="min-h-screen">

  <div x-cloak x-show="sidebarOpen" @click="sidebarOpen=false" class="fixed inset-0 z-30 bg-slate-900/60 backdrop-blur-sm md:hidden"></div>

  <!-- SIDEBAR -->
  <aside class="fixed inset-y-0 left-0 z-40 flex w-72 flex-col bg-slate-900 transition-transform duration-300 md:translate-x-0"
         :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'">
    <div class="flex items-center gap-3 border-b border-white/10 px-5 py-5">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-emerald-500 text-lg font-extrabold text-white">A</div>
      <div>
        <p class="text-[15px] font-bold leading-tight text-white">Autos HWC</p>
        <p class="text-[11px] text-slate-400" x-text="t('app_tag')"></p>
      </div>
    </div>

    <div class="flex items-center gap-3 px-5 py-4">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-emerald-500/15 text-lg font-bold text-emerald-400"
           x-text="user ? user.nombre.charAt(0).toUpperCase() : '·'"></div>
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold text-white" x-text="user?.nombre"></p>
        <span class="badge mt-0.5" :class="user?.rol==='admin' ? 'bg-rose-500/15 text-rose-300' : 'bg-emerald-500/15 text-emerald-300'"
              x-text="user?.rol==='admin' ? t('role_admin') : t('role_emp')"></span>
      </div>
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto px-3 pb-4">
      <button @click="go('dashboard')" :class="activeSection==='dashboard' ? 'bg-white/10 text-white' : 'text-slate-400 hover:bg-white/5 hover:text-white'" class="navitem">
        <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
        <span x-text="t('nav_dash')"></span>
      </button>
      <button @click="go('miscarros')" :class="activeSection==='miscarros' ? 'bg-white/10 text-white' : 'text-slate-400 hover:bg-white/5 hover:text-white'" class="navitem">
        <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>
        <span x-text="t('nav_mycars')"></span>
      </button>
      <button @click="go('historial')" :class="activeSection==='historial' ? 'bg-white/10 text-white' : 'text-slate-400 hover:bg-white/5 hover:text-white'" class="navitem">
        <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span x-text="user?.rol==='admin' ? t('nav_history') : t('nav_myexp')"></span>
      </button>
      <button @click="go('vehiculos')" :class="activeSection==='vehiculos' ? 'bg-white/10 text-white' : 'text-slate-400 hover:bg-white/5 hover:text-white'" class="navitem">
        <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        <span x-text="t('nav_vehicles')"></span>
      </button>

      <div x-cloak x-show="user?.rol==='admin'" class="mt-4 space-y-1 border-t border-white/10 pt-4">
        <p class="px-3.5 pb-1 text-[10px] font-bold uppercase tracking-widest text-slate-500" x-text="t('admin_section')"></p>
        <button @click="go('drivers')" :class="activeSection==='drivers' ? 'bg-white/10 text-white' : 'text-slate-400 hover:bg-white/5 hover:text-white'" class="navitem">
          <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3 3 0 11-6 0 3 3 0 016 0zM4.5 20.118a7.5 7.5 0 0115 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.5-1.632z"/></svg>
          <span x-text="t('nav_drivers')"></span>
        </button>
        <button @click="go('reportes')" :class="activeSection==='reportes' ? 'bg-white/10 text-white' : 'text-slate-400 hover:bg-white/5 hover:text-white'" class="navitem">
          <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"/></svg>
          <span x-text="t('nav_reports')"></span>
        </button>
        <button @click="abrirVeh()" class="navitem text-slate-400 hover:bg-white/5 hover:text-white">
          <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10.5v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span x-text="t('nav_addcar')"></span>
        </button>
      </div>
    </nav>

    <div class="space-y-1 border-t border-white/10 p-3">
      <button @click="cambiarLang()" class="navitem text-slate-400 hover:bg-white/5 hover:text-white">
        <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"/></svg>
        <span x-text="lang==='en' ? 'Español' : 'English'"></span>
      </button>
      <button @click="refrescar()" class="navitem text-slate-400 hover:bg-white/5 hover:text-white">
        <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
        <span x-text="t('refresh')"></span>
      </button>
      <button @click="logout()" class="navitem text-rose-400 hover:bg-rose-500/10 hover:text-rose-300">
        <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
        <span x-text="t('logout')"></span>
      </button>
    </div>
  </aside>

  <!-- CONTENIDO -->
  <div class="flex min-h-screen flex-col md:pl-72">

    <header class="sticky top-0 z-20 flex items-center justify-between border-b border-slate-200 bg-white px-4 py-3 md:hidden">
      <button @click="sidebarOpen=true" class="-ml-1 p-1.5 text-slate-600">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
      </button>
      <span class="font-bold text-slate-800">Autos <span class="text-emerald-600">HWC</span></span>
      <div class="w-9"></div>
    </header>

    <main class="relative flex-1 p-4 pb-28 sm:p-6 lg:p-8">

      <div x-cloak x-show="loading" class="absolute inset-0 z-10 flex items-center justify-center bg-white/70 backdrop-blur-[2px]">
        <svg class="h-10 w-10 animate-spin text-emerald-600" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
      </div>

      <!-- ══════ DASHBOARD ══════ -->
      <section x-cloak x-show="activeSection==='dashboard'">
        <div class="mb-6">
          <h1 class="text-xl font-bold text-slate-900 sm:text-2xl"><span x-text="t('dash_hello')"></span>, <span x-text="user?.nombre?.split(' ')[0]"></span> 👋</h1>
          <p class="text-sm text-slate-500" x-text="user?.rol==='admin' ? t('dash_sub_admin') : t('dash_sub_emp')"></p>
        </div>

        <div class="grid grid-cols-2 gap-3 sm:gap-4 xl:grid-cols-4">
          <div class="card p-4 sm:p-5">
            <p class="text-[12px] font-medium text-slate-500" x-text="t('kpi_active')"></p>
            <p class="mt-1 text-2xl font-bold text-slate-900 sm:text-3xl" x-text="vehActivos"></p>
            <p class="mt-1 text-[12px] text-slate-400"><span x-text="vehTaller"></span> <span x-text="t('kpi_in_repair')"></span> · <span x-text="vehiculos.length"></span> <span x-text="t('kpi_total')"></span></p>
          </div>
          <div class="card p-4 sm:p-5">
            <p class="text-[12px] font-medium text-slate-500" x-text="user?.rol==='admin' ? t('kpi_today') : t('kpi_my_today')"></p>
            <p class="mt-1 text-2xl font-bold text-slate-900 sm:text-3xl" x-text="fmtMoney(totalHoy)"></p>
            <p class="mt-1 text-[12px] text-slate-400"><span x-text="gastosHoyList.length"></span> <span x-text="t('kpi_rec_today')"></span></p>
          </div>
          <div class="card p-4 sm:p-5">
            <p class="text-[12px] font-medium text-slate-500" x-text="user?.rol==='admin' ? t('kpi_month') : t('kpi_my_month')"></p>
            <p class="mt-1 text-2xl font-bold text-slate-900 sm:text-3xl" x-text="fmtMoney(totalMes)"></p>
            <p class="mt-1 text-[12px] text-slate-400"><span x-text="gastosMes.length"></span> <span x-text="t('kpi_rec_month')"></span></p>
          </div>
          <div class="card p-4 sm:p-5">
            <p class="text-[12px] font-medium text-slate-500" x-text="t('kpi_vs')"></p>
            <template x-if="deltaMes===null">
              <p class="mt-1 text-2xl font-bold text-slate-400 sm:text-3xl">—</p>
            </template>
            <template x-if="deltaMes!==null">
              <div class="mt-1 flex items-center gap-1.5">
                <span class="text-2xl font-bold sm:text-3xl" :class="deltaMes>0 ? 'text-rose-600' : 'text-emerald-600'"
                      x-text="(deltaMes>0?'+':'') + deltaMes.toFixed(0) + '%'"></span>

              </div>
            </div>
            <div x-cloak x-show="repTipo==='empleado'">
              <input x-model="repEmpBusco" @input="buscarRepEmp()" class="inp" :placeholder="t('search_employee')">
              <div x-show="repEmpBusco && !repSelEmp" class="mt-1 max-h-40 divide-y divide-slate-100 overflow-y-auto rounded-xl border border-slate-200">
                <template x-for="p in repEmpOpciones" :key="p.id">

          <div class="card p-5"><p class="text-[12px] font-medium text-slate-500" x-text="t('rep_avg')"></p><p class="mt-1 text-2xl font-bold text-slate-900 sm:text-3xl" x-text="fmtMoney(repRes.count ? repRes.total/repRes.count : 0)"></p></div>
        </div>

        <div x-cloak x-show="repTipo==='general'" class="mb-4 grid gap-4 lg:grid-cols-2">

            <div class="relative h-64"><canvas id="chRepVeh"></canvas></div>
          </div>
          <div class="card p-5">
            <h3 class="mb-4 text-sm font-bold text-slate-800" x-text="t('top5_emp')"></h3>
            <div class="relative h-64"><canvas id="chRepEmp"></canvas></div>
          </div>
        </div>

        <div class="card overflow-hidden">
          <div class="flex items-center justify-between px-5 py-4">

              <thead class="sticky top-0 bg-slate-50"><tr>
                <th class="th" x-text="t('th_date')"></th><th class="th" x-text="t('th_vehicle')"></th><th class="th" x-text="t('th_employee')"></th>
                <th class="th" x-text="t('th_category')"></th><th class="th" x-text="t('th_concept')"></th><th class="th text-right" x-text="t('th_amount')"></th>
              </tr></thead>
              <tbody class="divide-y divide-slate-100">
                <template x-for="g in repPaginaDatos" :key="g.id">
                  <tr class="hover:bg-slate-50">
                    <td class="td text-slate-500" x-text="fmtFecha(g.fecha)"></td>
                    <td class="td font-medium text-slate-900"><span x-text="g.modelo"></span> <span class="font-mono text-[11px] text-slate-400" x-text="g.vin ? '· '+g.vin.slice(-6) : ''"></span></td>
                    <td class="td" x-text="g.empleado"></td>
                    <td class="td" x-text="g.categoria || '—'"></td>
                    <td class="td max-w-[220px] truncate" x-text="g.concepto"></td>
                    <td class="td text-right font-bold text-slate-900" x-text="fmtMoney(g.monto)"></td>
                  </tr>
                </template>
                <tr x-show="repPaginaDatos.length===0"><td colspan="6" class="px-4 py-10 text-center text-sm text-slate-400" x-text="t('no_records')"></td></tr>

          </div>
          <div class="flex flex-col items-center justify-between gap-3 border-t border-slate-100 p-4 sm:flex-row">
            <p class="text-[13px] text-slate-500"><span x-text="t('showing')"></span> <span x-text="repPaginaDatos.length"></span> <span x-text="t('of')"></span> <span x-text="repGastos.length"></span></p>
            <div class="flex items-center gap-2">
              <button @click="repPage=Math.max(1,repPage-1)" :disabled="repPage===1" class="btn-s px-3 py-2">←</button>

              <button @click="repPage=Math.min(repPaginas,repPage+1)" :disabled="repPage>=repPaginas" class="btn-s px-3 py-2">→</button>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- FAB -->
  <button x-cloak x-show="user && activeSection!=='reportes' && activeSection!=='drivers'" @click="abrirGasto()"
          class="fixed bottom-6 right-6 z-20 flex h-14 w-14 items-center justify-center rounded-full bg-emerald-600 text-white shadow-xl shadow-emerald-600/30 transition hover:scale-105 hover:bg-emerald-700">
    <svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
  </button>
</div>

      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="mx-auto max-w-2xl p-4 sm:p-6">
    <div class="space-y-5">
      <div>
        <label class="lbl" x-text="t('step1_vehicle')"></label>
        <template x-if="!gEsEdicion">
          <div>
            <input x-model="gBusco" @input="buscarVehOpciones()" class="inp" :placeholder="t('ph_search_veh_fab')" :disabled="!!gForm.vehiculo_id">
            <div x-show="gOpciones.length>0" class="mt-2 max-h-52 divide-y divide-slate-100 overflow-y-auto rounded-xl border border-slate-200">
              <template x-for="v in gOpciones" :key="v.id">
                <button @click="elegirVeh(v)" class="block w-full px-4 py-3 text-left hover:bg-emerald-50">
                  <p class="text-sm font-semibold text-slate-800" x-text="v.modelo"></p>
                  <p class="text-[12px] text-slate-400" x-text="'VIN: '+(v.vin||'—')+(v.placa ? ' · '+t('plate_colon')+v.placa : '')"></p>
                </button>
              </template>
            </div>
          </div>
        </template>
        <template x-if="gEsEdicion || gForm.vehiculo_id">
          <div class="flex items-center justify-between rounded-xl bg-emerald-50 px-4 py-3">
            <div>
              <p class="text-[11px] font-semibold uppercase text-emerald-600" x-text="t('vehicle_selected')"></p>
              <p class="text-sm font-bold text-emerald-800" x-text="gBusco"></p>
            </div>
            <button x-show="!gEsEdicion" @click="gForm.vehiculo_id=null; gBusco=''; gOpciones=[]" class="text-[13px] font-semibold text-rose-600 hover:text-rose-700" x-text="t('change')"></button>
          </div>
        </template>
      </div>

      <div class="grid gap-4 border-t border-slate-100 pt-5 sm:grid-cols-2">
        <div>
          <label class="lbl" x-text="t('amount_usd')"></label>
          <input type="number" step="0.01" min="0" x-model="gForm.monto" class="inp" placeholder="0.00">
        </div>
        <div>
          <label class="lbl" x-text="t('expense_date')"></label>
          <input type="date" x-model="gForm.fecha" class="inp">
        </div>
        <div>
          <label class="lbl" x-text="t('category')"></label>
          <select x-model="gForm.categoria_id" class="inp">
            <option value="" x-text="t('no_category')"></option>
            <template x-for="c in categorias" :key="c.id"><option :value="c.id" x-text="c.nombre"></option></template>
          </select>
        </div>
        <div>
          <label class="lbl" x-text="t('odometer')"></label>
          <input type="number" min="0" x-model="gForm.odometro" class="inp" :placeholder="t('optional')">
        </div>
        <div class="sm:col-span-2">
          <label class="lbl" x-text="t('concept')"></label>
          <input x-model="gForm.concepto" class="inp" :placeholder="t('ph_concept2')">
        </div>
      </div>

      <div class="border-t border-slate-100 pt-5">
        <label class="lbl" x-text="t('receipt_photo')"></label>
        <div class="flex items-center gap-4">
          <label class="btn-s cursor-pointer">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/></svg>
            <span x-text="gEsEdicion ? t('replace_photo') : t('choose_photo')"></span>
            <input type="file" accept="image/*" @change="elegirFoto($event)" class="hidden">
          </label>
          <img x-show="fotoPreview" :src="fotoPreview" class="h-20 w-20 rounded-xl border border-slate-200 object-cover">
          <p x-show="gEsEdicion && !fotoPreview" class="text-[12px] text-slate-400" x-text="t('keep_photo')"></p>
        </div>
        <p x-show="comprimiendo" class="mt-2 text-[13px] text-emerald-600" x-text="t('processing_img')"></p>
      </div>

      <button @click="guardarGasto()" :disabled="guardando" class="btn-p w-full py-3.5">
        <svg x-show="guardando" class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"/></svg>
        <span x-text="guardando ? t('saving') : t('save_expense')"></span>
      </button>
    </div>
  </div>
</div>

<!-- ══════════ MODAL: DETALLE DE GASTO ══════════ -->
<div x-cloak x-show="gastoDetalleOpen" class="fixed inset-0 z-50 overflow-y-auto bg-white">

            <p x-show="gSel.odometro"><span class="font-medium text-slate-500" x-text="t('odometer') + ':'"></span> <span x-text="gSel.odometro + ' mi'"></span></p>

    </template>

</div>

<!-- ══════════ MODAL: CREAR / EDITAR VEHÍCULO ══════════ -->

    <h2 class="text-lg font-bold text-slate-900" x-text="vEsEdicion ? t('edit_veh') : t('add_new_veh')"></h2>
    <button @click="vehOpen=false" class="rounded-full p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-700">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>

function fleetApp() {
  return {
    /* ── estado general ── */
    sb: null, canal: null, _rtT: null,
    lang: localStorage.getItem('hwcLang') || 'en',
    user: null, loginEmail: '', loginPass: '', loginError: '', showPass: false, cargandoLogin: false,
    loading: false,
    vehiculos: [], gastos: [], perfiles: [], categorias: [], favoritosIds: [],
    drivers: [], asignaciones: [],
    sidebarOpen: false, activeSection: 'dashboard',
    toast: { show: false, type: 'success', title: '', msg: '' }, _toastT: null,
    confirmModal: { show: false, title: '', msg: '', texto: 'Eliminar', action: null },

    /* ── gasto (form + detalle) ── */
    gastoOpen: false, gEsEdicion: false, gForm: {}, gBusco: '', gOpciones: [],
    fotoBlob: null, fotoPreview: '', comprimindo: false, guardando: false,
    gastoDetalleOpen: false, gSel: null, fotoUrl: null, firmandoFoto: false,

    /* ── vehículo (form + detalle) ── */
    vehOpen: false, vEsEdicion: false, vForm: {}, guardandoVeh: false,
    vehDetalleOpen: false, vSel: null,

    /* ── drivers ── */
    driverOpen: false, dEsEdicion: false, dForm: {}, guardandoDriver: false, buscarDriverTxt: '',

    /* ── filtros / paginación / reportes ── */
    fVeh: '', fConcepto: '', fCategoria: '', fEmpleado: '', fFecha: '', page: 1, perPage: 25,
    fvEmpleado: '', fvFecha: '', pageV: 1,
    buscarVeh: '',
    repTipo: 'general', repBusco: '', repOpciones: [], repSelVeh: null,
    repEmpBusco: '', repEmpOpciones: [], repSelEmp: null,
    repIni: '', repFin: '', repRes: { total: 0, count: 0 }, repPage: 1, repPerPage: 50,
    ch: { mes: null, rv: null, re: null },

    /* ══════ IDIOMA ══════ */
    t(k) { const e = TRAD[k]; return e ? (this.lang === 'es' ? e[1] : e[0]) : k; },
    cambiarLang() {
      this.lang = this.lang === 'en' ? 'es' : 'en';
      localStorage.setItem('hwcLang', this.lang);
      if (this.activeSection === 'dashboard') this.renderDashCharts();
      if (this.activeSection === 'reportes') this.generarReportes();
    },

    /* ══════ ARRANQUE ══════ */
    init() {
      this.sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      this.sb.auth.onAuthStateChange((_evt, session) => {
        if (session && session.user) this.arrancar(session.user);
        else this.apagar();
      });
      this.$watch('activeSection', v => {
        if (v === 'dashboard') this.renderDashCharts();
        if (v === 'reportes') this.generarReportes();
      });
    },

    async arrancar(authUser) {
      if (this.user && this.user.id === authUser.id) return;
      try {
        const { data: per, error } = await this.sb.from('profiles').select('id,nombre,rol').eq('id', authUser.id).single();
        if (error || !per) throw new Error(this.t('profile_err'));
        this.user = { id: authUser.id, email: authUser.email, nombre: per.nombre, rol: per.rol };
        this.loading = true;
        await this.cargarDatos();
        this.suscribirRealtime();
        this.renderDashCharts();
      } catch (e) {
        this.loginError = e.message || this.t('login_fail');
        await this.sb.auth.signOut();
      } finally { this.loading = false; }
    },

    apagar() {
      this.user = null; this.vehiculos = []; this.gastos = []; this.perfiles = []; this.categorias = []; this.favoritosIds = [];
      this.drivers = []; this.asignaciones = [];
      this.activeSection = 'dashboard'; this.sidebarOpen = false; this.loginEmail = ''; this.loginPass = ''; this.loginError = '';
      if (this.canal) { this.sb.removeChannel(this.canal); this.canal = null; }
      Object.values(this.ch).forEach(c => { if (c) c.destroy(); });
      this.ch = { mes: null, rv: null, re: null };
    },

    async login() {
      if (!this.loginEmail || !this.loginPass) { this.loginError = this.t('err_complete'); return; }
      this.cargandoLogin = true; this.loginError = '';
      const { error } = await this.sb.auth.signInWithPassword({ email: this.loginEmail, password: this.loginPass });
      if (error) this.loginError = (error.message === 'Invalid login credentials') ? this.t('err_creds') : error.message;
      this.cargandoLogin = false;
    },
    async logout() { await this.sb.auth.signOut(); },

    /* ══════ DATOS ══════ */
    async cargarDatos() {
      const [r1, r2, r3, r4, r5, r6, r7] = await Promise.all([
        this.sb.from('vehiculos').select('*').order('modelo'),
        this.sb.from('gastos_detalle').select('*').order('fecha', { ascending: false }).order('created_at', { ascending: false }).limit(5000),
        this.sb.from('profiles').select('id,nombre,rol').order('nombre'),
        this.sb.from('categorias').select('id,nombre,orden').order('orden'),
        this.sb.from('favoritos').select('vehiculo_id').eq('user_id', this.user.id),
        this.sb.from('drivers').select('*').order('nombre'),
        this.sb.from('vehiculo_drivers').select('*'),
      ]);
      if ([r1, r2, r3, r4, r5, r6, r7].some(r => r.error)) { this.avisar(this.t('toast_err'), this.t('load_error'), 'error'); return; }
      this.vehiculos = r1.data; this.gastos = r2.data; this.perfiles = r3.data;
      this.categorias = r4.data; this.favoritosIds = r5.data.map(f => f.vehiculo_id);
      this.drivers = r6.data; this.asignaciones = r7.data;
    },

    async refrescar() {
      this.loading = true;
      await this.cargarDatos();
      if (this.activeSection === 'dashboard') this.renderDashCharts();
      if (this.activeSection === 'reportes') this.generarReportes();
      this.loading = false;
      this.avisar(this.t('toast_ok'), this.t('data_updated'));
    },

    suscribirRealtime() {
      if (this.canal) return;
      this.canal = this.sb.channel('hwc-cambios')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'gastos' }, () => this.recargarEnVivo())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'vehiculos' }, () => this.recargarEnVivo())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'favoritos' }, () => this.recargarEnVivo())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'drivers' }, () => this.recargarEnVivo())
        .on('postgres_changes', { event: '*', schema: 'public', table: 'vehiculo_drivers' }, () => this.recargarEnVivo())
        .subscribe();
    },
    recargarEnVivo() {
      clearTimeout(this._rtT);
      this._rtT = setTimeout(async () => {
        await this.cargarDatos();
        if (this.activeSection === 'dashboard') this.renderDashCharts();
        if (this.activeSection === 'reportes') this.generarReportes();
      }, 700);
    },

    /* ══════ HELPERS ══════ */
    go(s) { this.activeSection = s; this.sidebarOpen = false; window.scrollTo({ top: 0 }); },
    avisar(title, msg, type = 'success') {
      this.toast = { show: true, type, title, msg };
      clearTimeout(this._toastT);
      this._toastT = setTimeout(() => this.toast.show = false, 3500);
    },
    confirmar(title, msg, action, texto = null) { this.confirmModal = { show: true, title, msg, texto: texto || this.t('delete'), action }; },
    confirmarSi() { const a = this.confirmModal.action; this.confirmModal.show = false; if (a) a(); },
    fmtMoney(n) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(parseFloat(n) || 0); },
    fmtFecha(iso) { if (!iso) return '—'; return new Date(iso + 'T00:00:00').toLocaleDateString(this.lang === 'es' ? 'es-ES' : 'en-US', { day: '2-digit', month: 'short', year: 'numeric' }); },
    hoy() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
    nul(v) { return (v === '' || v === undefined) ? null : v; },
    nombreDe(uid) { const p = this.perfiles.find(p => p.id === uid); return p ? p.nombre : '—'; },
    esFav(id) { return this.favoritosIds.includes(id); },
    diasHasta(f) { return Math.round((new Date(f + 'T00:00:00') - new Date(this.hoy() + 'T00:00:00')) / 86400000); },
    venCls(f) { if (!f) return ''; const d = this.diasHasta(f); if (d < 0) return 'bg-rose-100 text-rose-700'; if (d <= 15) return 'bg-amber-100 text-amber-700'; return 'bg-emerald-100 text-emerald-700'; },
    venTxt(f) {
      if (!f) return '—'; const d = this.diasHasta(f);
      if (d < 0) return this.t('expired_ago').replace('{d}', Math.abs(d));
      if (d === 0) return this.t('expires_today');
      return this.t('in_days').replace('{d}', d);
    },
    estadoCls(e) { return { activo: 'bg-emerald-100 text-emerald-700', en_reparacion: 'bg-amber-100 text-amber-700', vendido: 'bg-slate-200 text-slate-600', inactivo: 'bg-slate-200 text-slate-500' }[e] || 'bg-slate-100 text-slate-600'; },
    estadoTxt(e) { return { activo: this.t('st_active'), en_reparacion: this.t('st_repair'), vendido: this.t('st_sold'), inactivo: this.t('st_inactive') }[e] || e; },
    catColor(n) {
      const pal = ['bg-emerald-100 text-emerald-700', 'bg-sky-100 text-sky-700', 'bg-amber-100 text-amber-700', 'bg-violet-100 text-violet-700', 'bg-rose-100 text-rose-700', 'bg-teal-100 text-teal-700', 'bg-orange-100 text-orange-700', 'bg-indigo-100 text-indigo-700'];
      let h = 0; const s = n || '?'; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return pal[h % pal.length];
    },
    gastoTotalVeh(id) { return this.gastos.filter(g => g.vehiculo_id === id).reduce((s, g) => s + (+g.monto || 0), 0); },

    /* ══════ COMPUTEDS: DASHBOARD ══════ */
    get vehActivos() { return this.vehiculos.filter(v => v.estado === 'activo').length; },
    get vehTaller() { return this.vehiculos.filter(v => v.estado === 'en_reparacion').length; },
    get gastosHoyList() { return this.gastos.filter(g => g.fecha === this.hoy()); },
    get totalHoy() { return this.gastosHoyList.reduce((s, g) => s + (+g.monto || 0), 0); },
    get mesActual() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); },
    get mesPrevKey() { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); },
    get gastosMes() { return this.gastos.filter(g => g.fecha && g.fecha.startsWith(this.mesActual)); },
    get totalMes() { return this.gastosMes.reduce((s, g) => s + (+g.monto || 0), 0); },
    get totalMesPrev() { return this.gastos.filter(g => g.fecha && g.fecha.startsWith(this.mesPrevKey)).reduce((s, g) => s + (+g.monto || 0), 0); },
    get deltaMes() { if (this.totalMesPrev === 0) return null; return ((this.totalMes - this.totalMesPrev) / this.totalMesPrev) * 100; },
    get categoriasMes() {
      const m = {};
      this.gastosMes.forEach(g => { const k = g.categoria || this.t('xl_no_cat'); m[k] = (m[k] || 0) + (+g.monto || 0); });
      const arr = Object.entries(m).map(([nombre, total]) => ({ nombre, total })).sort((a, b) => b.total - a.total);
      const max = Math.max(...arr.map(a => a.total), 1);
      return arr.map(a => ({ ...a, pct: Math.round(a.total / max * 100) }));
    },
    get alertasVenc() {
      const out = [];
      this.vehiculos.forEach(v => {
        if (v.estado === 'vendido' || v.estado === 'inactivo') return;
        if (v.seguro_vencimiento) { const d = this.diasHasta(v.seguro_vencimiento); if (d <= 30) out.push({ veh: v, tipo: this.t('ins_expiry'), fecha: v.seguro_vencimiento, dias: d }); }
        if (v.registro_vencimiento) { const d = this.diasHasta(v.registro_vencimiento); if (d <= 30) out.push({ veh: v, tipo: this.t('reg_expiry'), fecha: v.registro_vencimiento, dias: d }); }
      });
      return out.sort((a, b) => a.dias - b.dias);
    },

    /* ══════ COMPUTEDS: MIS CARROS ══════ */
    get misCarros() {
      if (!this.user) return [];
      const out = [], ids = new Set();
      const miDriver = this.drivers.find(d => d.user_id === this.user.id);
      if (miDriver) {
        this.asignaciones.filter(a => a.driver_id === miDriver.id).forEach(a => {
          const v = this.vehiculos.find(x => x.id === a.vehiculo_id);
          if (v && !ids.has(v.id)) { ids.add(v.id); out.push(v); }
        });
      }
      this.vehiculos.filter(v => this.esFav(v.id)).forEach(v => { if (!ids.has(v.id)) { ids.add(v.id); out.push(v); } });
      return out;
    },

    /* ══════ COMPUTEDS: VEHÍCULOS / HISTORIAL ══════ */
    get vehTabla() {
      const t = this.buscarVeh.trim().toLowerCase();
      if (!t) return this.vehiculos;
      return this.vehiculos.filter(v => [v.vin, v.modelo, v.placa, v.title, this.resumenDrivers(v.id)].some(x => (x || '').toLowerCase().includes(t)));
    },
    get gastosFiltrados() {
      return this.gastos.filter(g => {
        const a = !this.fVeh || (g.vin + ' ' + g.modelo).toLowerCase().includes(this.fVeh.toLowerCase());
        const b = !this.fConcepto || (g.concepto || '').toLowerCase().includes(this.fConcepto.toLowerCase());
        const c = !this.fCategoria || g.categoria_id === this.fCategoria;
        const d = !this.fEmpleado || g.usuario_id === this.fEmpleado;
        const e = !this.fFecha || g.fecha === this.fFecha;
        return a && b && c && d && e;
      });
    },
    get totalPaginas() { return Math.max(1, Math.ceil(this.gastosFiltrados.length / this.perPage)); },
    get gastosPagina() { const s = (this.page - 1) * this.perPage; return this.gastosFiltrados.slice(s, s + this.perPage); },
    limpiarHistorial() { this.fVeh = ''; this.fConcepto = ''; this.fCategoria = ''; this.fEmpleado = ''; this.fFecha = ''; this.page = 1; },

    get gastosVeh() { return this.vSel ? this.gastos.filter(g => g.vehiculo_id === this.vSel.id) : []; },
    get gastosVehFiltrados() {
      return this.gastosVeh.filter(g =>
        (!this.fvEmpleado || g.usuario_id === this.fvEmpleado) && (!this.fvFecha || g.fecha === this.fvFecha));
    },
    get paginasV() { return Math.max(1, Math.ceil(this.gastosVehFiltrados.length / this.perPage)); },
    get gastosVehPagina() { const s = (this.pageV - 1) * this.perPage; return this.gastosVehFiltrados.slice(s, s + this.perPage); },
    get totalVeh() { return this.gastosVeh.reduce((s, g) => s + (+g.monto || 0), 0); },
    get ultimoGastoVeh() { return this.gastosVeh[0] || null; },

    abrirGasto(vehId = '') {

      this.gBusco = vehId ? this.etiquetaVeh(vehId) : '';

    etiquetaVeh(id) { const v = this.vehiculos.find(x => x.id === id); return v ? `${v.modelo} · ${v.vin || this.t('no_vin')}` : ''; },
    buscarVehOpciones() {

      if (!t) { this.gOpciones = []; return; }
      this.gOpciones = this.vehiculos.filter(v =>
        v.estado !== 'vendido' && v.estado !== 'inactivo' &&

      ).slice(0, 6);

    async elegirFoto(e) {
      const file = e.target.files[0]; if (!file) return;
      this.comprimiendo = true; this.fotoPreview = '';
      try {
        const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
        const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
        const MAX = 900; let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        this.fotoPreview = cv.toDataURL('image/jpeg', 0.6);
        this.fotoBlob = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.6));
      } catch { this.avisar(this.t('toast_err'), this.t('photo_error'), 'error'); }
      this.comprimiendo = false; e.target.value = '';
    },

    async guardarGasto() {
      const f = this.gForm;
      if (!f.vehiculo_id) { this.avisar(this.t('no_veh_t'), this.t('no_veh_m'), 'error'); return; }
      if (!f.monto || parseFloat(f.monto) <= 0) { this.avisar(this.t('amt_t'), this.t('amt_m'), 'error'); return; }
      if (!f.concepto || !f.concepto.trim()) { this.avisar(this.t('conc_t'), this.t('conc_m'), 'error'); return; }
      this.guardando = true;
      try {
        let fotoPath = this.gEsEdicion ? (this.gSel.foto_url || null) : null;
        if (this.fotoBlob) {
          if (this.gEsEdicion && this.gSel.foto_url) await this.sb.storage.from('facturas').remove([this.gSel.foto_url]);
          fotoPath = `${this.user.id}/${Date.now()}.jpg`;
          const { error: eUp } = await this.sb.storage.from('facturas').upload(fotoPath, this.fotoBlob, { contentType: 'image/jpeg' });
          if (eUp) throw new Error(this.t('photo_up_err') + eUp.message);
        }
        const fila = {
          concepto: f.concepto.trim(), monto: parseFloat(f.monto),
          fecha: f.fecha || this.hoy(), categoria_id: f.categoria_id || null,
          odometro: f.odometro ? parseInt(f.odometro) : null,
        };
        if (this.fotoBlob) fila.foto_url = fotoPath;
        let error;
        if (this.gEsEdicion) ({ error } = await this.sb.from('gastos').update(fila).eq('id', f.id));
        else { fila.vehiculo_id = f.vehiculo_id; fila.usuario_id = this.user.id; fila.foto_url = fotoPath; ({ error } = await this.sb.from('gastos').insert(fila)); }
        if (error) throw new Error(error.message);
        this.avisar(this.t('toast_ok'), this.gEsEdicion ? this.t('ok_updated') : this.t('ok_saved'));
        this.gastoOpen = false;
        await this.cargarDatos();
        if (this.activeSection === 'dashboard') this.renderDashCharts();
      } catch (e) { this.avisar(this.t('toast_err'), e.message || this.t('login_fail'), 'error'); }
      this.guardando = false;
    },

    async guardarVeh() {
      const f = this.vForm;
      if (!f.modelo.trim()) { this.avisar(this.t('model_t'), this.t('model_m'), 'error'); return; }
      if (!f.vin.trim()) { this.avisar(this.t('vin_t'), this.t('vin_m'), 'error'); return; }

      };
      try {
        let vehiculoId;
        if (this.vEsEdicion) {
          const { error } = await this.sb.from('vehiculos').update(fila).eq('id', f.id);

      } catch (e) {

    pedirBorrarVeh() {

    /* ══════ DRIVERS ══════ */

    abrirDriver(d = null) {

    async guardarDriver() {

      if (!f.nombre.trim()) { this.avisar(this.t('name_t'), this.t('name_m'), 'error'); return; }

      const fila = { nombre: f.nombre.trim(), telefono: this.nul(f.telefono), nota: this.nul(f.nota), user_id: f.user_id || null };
      let error;
      if (this.dEsEdicion) ({ error } = await this.sb.from('drivers').update(fila).eq('id', f.id));

    },
    pedirBorrarDriver(d) {

      const msg = k > 0 ? this.t('del_driver_m').replace('{n}', d.nombre).replace('{k}', k) : this.t('del_driver_m2').replace('{n}', d.nombre);

        if (error) { this.avisar(this.t('toast_err'), error.message, 'error'); return; }
        this.avisar(this.t('toast_ok'), this.t('driver_deleted'));
        await this.cargarDatos();
      });

    nombreDriver(id) { const d = this.drivers.find(x => x.id === id); return d ? d.nombre : '—'; },
    driversDeVeh(vid) { return this.asignaciones.filter(a => a.vehiculo_id === vid); },
    autosDeDriver(did) {
      return this.asignaciones.filter(a => a.driver_id === did).map(a => {
        const v = this.vehiculos.find(x => x.id === a.vehiculo_id);
        return v ? { veh: v, principal: a.principal } : null;
      }).filter(Boolean);
    },
    resumenDrivers(vid) {
      const l = this.driversDeVeh(vid);
      if (!l.length) return '—';
      const n = l.map(a => this.nombreDriver(a.driver_id));
      return n.length > 2 ? n.slice(0, 2).join(', ') + ' +' + (n.length - 2) : n.join(', ');
    },
    get driversNoEnForm() {
      const ids = (this.vForm.asignaciones || []).map(a => a.driver_id);
      return this.drivers.filter(d => !ids.includes(d.id));
    },
    agregarAsignacion() {
      if (!this.vForm.nuevoDriver) { this.avisar(this.t('pick_driver_t'), this.t('pick_driver_m'), 'error'); return; }
      this.vForm.asignaciones.push({ driver_id: this.vForm.nuevoDriver, nombre: this.nombreDriver(this.vForm.nuevoDriver), principal: this.vForm.nuevoTipo === 'principal' });
      this.vForm.nuevoDriver = ''; this.vForm.nuevoTipo = 'principal';
    },
    quitarAsignacion(driverId) { this.vForm.asignaciones = this.vForm.asignaciones.filter(a => a.driver_id !== driverId); },
    async sincronizarAsignaciones(vehiculoId, asignaciones) {
      await this.sb.from('vehiculo_drivers').delete().eq('vehiculo_id', vehiculoId);
      if (asignaciones.length) {
        const { error } = await this.sb.from('vehiculo_drivers').insert(asignaciones.map(a => ({ vehiculo_id: vehiculoId, driver_id: a.driver_id, principal: a.principal })));
        if (error) this.avisar(this.t('assign_warn_t'), this.t('assign_warn_m') + error.message, 'error');
      }
    },

    /* ══════ REPORTES ══════ */

      if (this.repFin) l = l.filter(g => g.fecha <= this.repFin);
      if (this.repTipo === 'vehiculo' && this.repSelVeh) l = l.filter(g => g.vehiculo_id === this.repSelVeh);
      if (this.repTipo === 'empleado' && this.repSelEmp) l = l.filter(g => g.usuario_id === this.repSelEmp);
      return l;
    },
    get repPaginas() { return Math.max(1, Math.ceil(this.repGastos.length / this.repPerPage)); },
    get repPaginaDatos() { const s = (this.repPage - 1) * this.repPerPage; return this.repGastos.slice(s, s + this.repPerPage); },
    buscarRepVeh() {
      const t = this.repBusco.trim().toLowerCase(); this.repSelVeh = null;
      if (!t) { this.repOpciones = []; return; }
      this.repOpciones = this.vehiculos.filter(v => [v.vin, v.modelo, v.placa].some(x => (x || '').toLowerCase().includes(t))).slice(0, 6);
    },
    elegirRepVeh(v) { this.repSelVeh = v.id; this.repBusco = `${v.modelo} · ${v.vin || this.t('no_vin')}`; this.repOpciones = []; this.generarReportes(); },

    elegirRepEmp(p) { this.repSelEmp = p.id; this.repEmpBusco = p.nombre; this.repEmpOpciones = []; this.generarReportes(); },
    limpiarReportes() {

    /* ══════ CHARTS ══════ */
    matar(k) { if (this.ch[k]) { this.ch[k].destroy(); this.ch[k] = null; } },
    renderDashCharts() {
      this.$nextTick(() => {
        this.matar('mes');
        const cv = document.getElementById('chMes'); if (!cv) return;
        const MESES = this.lang === 'es'
          ? ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']
          : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const labels = [], totales = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
          const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
          labels.push(MESES[d.getMonth()]);
          totales.push(this.gastos.filter(g => g.fecha && g.fecha.startsWith(key)).reduce((s, g) => s + (+g.monto || 0), 0));
        }
        this.ch.mes = new Chart(cv, {
          type: 'bar',
          data: { labels, datasets: [{ data: totales, backgroundColor: totales.map((_, i) => i === totales.length - 1 ? '#10b981' : '#a7f3d0'), borderRadius: 8, maxBarThickness: 46 }] },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => this.fmtMoney(c.parsed.y) } } },
            scales: { y: { beginAtZero: true, ticks: { callback: v => '$' + v } }, x: { grid: { display: false } } }
          }
        });
      });
    },
    renderRepCharts(l) {
      this.$nextTick(() => {
        this.matar('rv'); this.matar('re');
        const mv = {}; l.forEach(g => { mv[g.vehiculo_id] = (mv[g.vehiculo_id] || 0) + (+g.monto || 0); });
        const top = Object.entries(mv).map(([id, t]) => {
          const v = this.vehiculos.find(x => x.id === id) || {};
          return { et: (v.modelo || '—') + (v.vin ? ' · …' + v.vin.slice(-6) : ''), t };
        }).sort((a, b) => b.t - a.t).slice(0, 5);
        const cv = document.getElementById('chRepVeh');
        if (cv) this.ch.rv = new Chart(cv, {
          type: 'bar',
          data: { labels: top.map(x => x.et), datasets: [{ data: top.map(x => x.t), backgroundColor: '#0ea5e9', borderRadius: 8, maxBarThickness: 30 }] },
          options: {
            indexAxis: 'y', responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => this.fmtMoney(c.parsed.x) } } },
            scales: { x: { beginAtZero: true, ticks: { callback: v => '$' + v } } }
          }
        });
        const me = {}; l.forEach(g => { me[g.empleado] = (me[g.empleado] || 0) + (+g.monto || 0); });
        const tope = Object.entries(me).map(([n, t]) => ({ n, t })).sort((a, b) => b.t - a.t).slice(0, 5);
        const ce = document.getElementById('chRepEmp');
        if (ce) this.ch.re = new Chart(ce, {
          type: 'doughnut',
          data: { labels: tope.map(x => x.n), datasets: [{ data: tope.map(x => x.t), backgroundColor: ['#10b981', '#0ea5e9', '#f59e0b', '#8b5cf6', '#f43f5e'], borderWidth: 2, borderColor: '#fff' }] },
          options: {
            responsive: true, maintainAspectRatio: false, cutout: '62%',
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }, tooltip: { callbacks: { label: c => ` ${c.label}: ${this.fmtMoney(c.parsed)}` } } }
          }
        });
      });
    },

    /* ══════ EXPORTS ══════ */
    exportExcel() {
      const l = this.repGastos;
      if (!l.length) { this.avisar(this.t('nothing_export'), this.t('no_records_export'), 'error'); return; }
      const wb = XLSX.utils.book_new();
      const det = l.map(g => ({
        [this.t('th_date')]: this.fmtFecha(g.fecha),
        [this.t('xl_veh')]: `${g.modelo}${g.vin ? ' (' + g.vin + ')' : ''}`,
        [this.t('xl_emp')]: g.empleado,
        [this.t('xl_cat')]: g.categoria || '—',
        [this.t('xl_concept')]: g.concepto,
        [this.t('xl_amount')]: +(+g.monto).toFixed(2),
        [this.t('xl_odo')]: g.odometro || ''
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(det), this.t('xl_detail_sheet'));
      const mv = {}; l.forEach(g => { const k = `${g.modelo}${g.vin ? ' (' + g.vin + ')' : ''}`; mv[k] = (mv[k] || 0) + +g.monto; });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
        Object.entries(mv).map(([k, v]) => ({ [this.t('xl_veh')]: k, [this.t('xl_total_spent')]: +v.toFixed(2) })).sort((a, b) => b[this.t('xl_total_spent')] - a[this.t('xl_total_spent')])
      ), this.t('xl_top_veh_sheet'));
      const me = {}; l.forEach(g => { me[g.empleado] = (me[g.empleado] || 0) + +g.monto; });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
        Object.entries(me).map(([k, v]) => ({ [this.t('xl_emp')]: k, [this.t('xl_total_reg')]: +v.toFixed(2) })).sort((a, b) => b[this.t('xl_total_reg')] - a[this.t('xl_total_reg')])
      ), this.t('xl_top_emp_sheet'));
      const mc = {}; l.forEach(g => { const k = g.categoria || this.t('xl_no_cat'); mc[k] = (mc[k] || 0) + +g.monto; });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
        Object.entries(mc).map(([k, v]) => ({ [this.t('xl_cat')]: k, [this.t('total')]: +v.toFixed(2) })).sort((a, b) => b[this.t('total')] - a[this.t('total')])
      ), this.t('xl_cat_sheet'));
      XLSX.writeFile(wb, 'Reporte_Autos_HWC.xlsx');
      this.avisar(this.t('toast_ok'), this.t('excel_done'));
    },
    exportPDF() {
      const l = this.repGastos;
      if (!l.length) { this.avisar(this.t('nothing_export'), this.t('no_records_export'), 'error'); return; }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFontSize(18); doc.text(this.t('pdf_title'), 14, 18);
      doc.setFontSize(9); doc.setTextColor(110);
      let tipo = this.t('pdf_type_lbl') + ' ' + this.t('rep_general');
      if (this.repTipo === 'vehiculo' && this.repSelVeh) {
        const v = this.vehiculos.find(x => x.id === this.repSelVeh);
        tipo = this.t('pdf_type_lbl') + ' ' + this.t('pdf_type_veh') + ' — ' + (v ? `${v.modelo} (${v.vin || this.t('no_vin')})` : '');
      }
      if (this.repTipo === 'empleado' && this.repSelEmp) tipo = this.t('pdf_type_lbl') + ' ' + this.t('pdf_type_emp') + ' — ' + this.repEmpBusco;
      let per;
      if (this.repIni && this.repFin) per = `${this.t('pdf_period_lbl')} ${this.repIni} ${this.t('pdf_to')} ${this.repFin}`;
      else if (this.repIni) per = `${this.t('pdf_period_lbl')} ${this.t('pdf_since')} ${this.repIni}`;
      else if (this.repFin) per = `${this.t('pdf_period_lbl')} ${this.t('pdf_until')} ${this.repFin}`;
      else per = this.t('pdf_period_lbl') + ' ' + this.t('pdf_all');
      doc.text(tipo, 14, 26); doc.text(per, 14, 31);
      doc.setTextColor(20); doc.setFontSize(11);
      doc.text(`${this.t('pdf_total')}: ${this.fmtMoney(this.repRes.total)}   ·   ${this.t('pdf_records')}: ${this.repRes.count}   ·   ${this.t('pdf_avg')}: ${this.fmtMoney(this.repRes.count ? this.repRes.total / this.repRes.count : 0)}`, 14, 39);
      let y = 46;
      if (this.repTipo === 'general') {
        const mv = {}; l.forEach(g => { const k = `${g.modelo}${g.vin ? ' (…' + g.vin.slice(-6) + ')' : ''}`; mv[k] = (mv[k] || 0) + +g.monto; });
        const tv = Object.entries(mv).map(([k, v]) => [k, this.fmtMoney(v)]).sort((a, b) => parseFloat(b[1].slice(1).replace(/,/g, '')) - parseFloat(a[1].slice(1).replace(/,/g, ''))).slice(0, 5);
        doc.autoTable({ startY: y, head: [[this.t('pdf_top_veh'), this.t('pdf_total')]], body: tv, theme: 'striped', headStyles: { fillColor: [16, 185, 129] }, styles: { fontSize: 9 } });
        y = doc.lastAutoTable.finalY + 6;
        const me = {}; l.forEach(g => { me[g.empleado] = (me[g.empleado] || 0) + +g.monto; });
        const te = Object.entries(me).map(([k, v]) => [k, this.fmtMoney(v)]).sort((a, b) => parseFloat(b[1].slice(1).replace(/,/g, '')) - parseFloat(a[1].slice(1).replace(/,/g, ''))).slice(0, 5);
        doc.autoTable({ startY: y, head: [[this.t('pdf_top_emp'), this.t('pdf_total')]], body: te, theme: 'striped', headStyles: { fillColor: [14, 165, 233] }, styles: { fontSize: 9 } });
        y = doc.lastAutoTable.finalY + 8;
      }
      doc.autoTable({
        startY: y,
        head: [[this.t('th_date'), this.t('th_vehicle'), this.t('th_employee'), this.t('th_category'), this.t('th_concept'), this.t('th_amount')]],
        body: l.map(g => [this.fmtFecha(g.fecha), `${g.modelo}${g.vin ? ' · ' + g.vin.slice(-6) : ''}`, g.empleado, g.categoria || '—', g.concepto, this.fmtMoney(g.monto)]),
        theme: 'grid', headStyles: { fillColor: [51, 65, 85] }, styles: { fontSize: 8 }
      });
      doc.save('Reporte_Autos_HWC.pdf');
      this.avisar(this.t('toast_ok'), this.t('pdf_done'));
    },
  }
}
</script>
</body>
</html>
